# Meson cross-compilation file for Emscripten / WebAssembly
# Usage: meson setup build-web --cross-file emscripten/cross_compilation.ini
#
# Prerequisites:
#   - emsdk installed and activated (emcc/em++ must be on PATH)
#   - Run: source /path/to/emsdk/emsdk_env.sh

[binaries]
c       = 'emcc'
cpp     = 'em++'
ar      = 'emar'
strip   = 'emstrip'
pkgconfig = 'pkg-config'

[host_machine]
system     = 'emscripten'
cpu_family = 'wasm32'
cpu        = 'wasm32'
endian     = 'little'

[properties]
# Tell Meson this is a cross build targeting the browser
needs_exe_wrapper = true
# Disable features that don't make sense for WASM
has_function_printf = true
has_function_hstrerror = true

[built-in options]
# C++20 is supported by Emscripten's libc++
cpp_std      = 'c++20'
# Use -O2 for release; change to -O0 for debug iterations
optimization = '2'
debug        = false
# Static libraries only — no .so in WASM
default_library = 'static'
